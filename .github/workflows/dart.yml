name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 🧾 Checkout the code
      - uses: actions/checkout@v4

      # 🛠️ Setup Flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.1' # Optional: use specific Flutter version

      # 📦 Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 🧪 Analyze the code
      - name: Analyze project source
        run: flutter analyze

      # 🧪 Run tests
      - name: Run tests
        run: flutter test

      # ✅ Optional: Verify code formatting
      # - name: Verify formatting
      #   run: dart format --output=none --set-exit-if-changed .
